# CI — chạy đúng những thứ đã từng để lọt lỗi ra tới app đang chạy.
#
# Vì sao cần: repo có 440 test backend + 61 test frontend, và cho tới lúc file này
# ra đời thì KHÔNG có gì chạy chúng tự động. CLAUDE.md ghi "mọi thay đổi backend
# phải chạy npm test trước khi kết thúc" — một quy tắc không có cơ chế nào bắt
# buộc. Đó đúng là khuôn của `SYS-001` trong ledger: luật viết một lần rồi mặc
# định là ai cũng nhớ.
#
# Hai scanner quan trọng nhất (`routeGuards`, `adminEscaping`) sinh ra để đỏ khi
# có người tái lập một LỚP lỗi. Chúng chỉ có giá trị nếu chạy vào lúc còn người
# đọc kết quả.

name: CI

on:
  push:
    branches: ['**']
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      # Node 20 để KHỚP production (backend/Dockerfile dùng node:20-alpine).
      # Máy dev đang chạy v22 — nếu code lỡ dùng API chỉ có ở 22 thì đây là chỗ
      # phải đỏ, chứ không phải lúc container khởi động.
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: |
            backend/package-lock.json
            frontend/package-lock.json

      - name: Cài deps
        run: |
          npm ci --prefix backend
          npm ci --prefix frontend

      # BUILD TRƯỚC, TEST SAU — thứ tự này có chủ ý, hai lý do:
      #
      # 1. `npm run build` là thứ duy nhất bắt được lỗi cú pháp/import trong mã
      #    frontend. Trong lịch sử repo này đã có một lần thiếu `async` khiến vite
      #    PARSE_ERROR và app chết trắng, trong khi toàn bộ test vẫn xanh.
      #
      # 2. `spaServing.test.js` quét `frontend/dist` để đối chiếu mọi host ngoài
      #    với CSP. Không có dist thì nó tự bỏ qua — tức chạy test trước build sẽ
      #    làm mất đúng cái test đã bắt được 4 lỗ CSP.
      - name: Build frontend
        run: npm run build --prefix frontend

      - name: Test frontend
        run: npm test --prefix frontend

      - name: Test backend
        run: npm test --prefix backend
