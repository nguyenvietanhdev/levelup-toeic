    <!-- Modal: Bộ đề TOEIC -->
    <div id="ts-modal" style="display:none;position:fixed;inset:0;background:rgba(0,0,0,0.5);z-index:1000;align-items:center;justify-content:center">
      <div style="background:var(--bg-primary,white);border-radius:14px;padding:28px;max-width:480px;width:94%">
        <h3 style="margin-bottom:20px;color:var(--primary)"><i class="fas fa-tags"></i> <span id="ts-modal-title">Thêm bộ đề</span></h3>
        <form id="ts-form">
          <input type="hidden" id="ts-id">
          <div style="margin-bottom:12px">
            <label style="font-size:12px;font-weight:600;color:var(--text-secondary)">Tên bộ (hiện trên nút lọc) *</label>
            <input type="text" id="ts-name" required placeholder="vd: ETS 2026" style="width:100%;padding:9px;border:1.5px solid var(--border-color);border-radius:8px;margin-top:4px">
          </div>
          <div style="margin-bottom:12px">
            <label style="font-size:12px;font-weight:600;color:var(--text-secondary)">Từ khoá — tiền tố source key *</label>
            <input type="text" id="ts-keys" required placeholder="vd: ets26" style="width:100%;padding:9px;border:1.5px solid var(--border-color);border-radius:8px;margin-top:4px;font-family:monospace">
            <div style="font-size:11px;color:var(--text-secondary);margin-top:4px">Nhiều tiền tố thì ngăn bởi dấu phẩy: <code>ets26, ets2026</code></div>
          </div>
          <div style="display:flex;gap:16px;align-items:center;margin-bottom:18px">
            <div style="flex:0 0 120px">
              <label style="font-size:12px;font-weight:600;color:var(--text-secondary)">Thứ tự</label>
              <input type="number" id="ts-order" value="0" style="width:100%;padding:9px;border:1.5px solid var(--border-color);border-radius:8px;margin-top:4px">
            </div>
            <label style="font-size:13px;display:inline-flex;align-items:center;gap:6px;margin-top:18px"><input type="checkbox" id="ts-active" checked> đang bật</label>
          </div>
          <div style="display:flex;justify-content:flex-end;gap:10px">
            <button type="button" id="btn-ts-cancel" class="btn btn-secondary">Hủy</button>
            <button type="submit" class="btn btn-primary"><i class="fas fa-save"></i> Lưu</button>
          </div>
        </form>
      </div>
    </div>
