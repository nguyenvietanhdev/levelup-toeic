    <!-- Modal Xóa nhanh -->
    <div
      id="quick-delete-modal"
      style="
        display: none;
        position: fixed;
        inset: 0;
        background: rgba(0, 0, 0, 0.75);
        z-index: 3500;
        align-items: center;
        justify-content: center;
      "
    >
      <div
        style="
          background: white;
          border-radius: 20px;
          padding: 40px;
          width: 90%;
          max-width: 600px;
          box-shadow: 0 20px 60px rgba(0, 0, 0, 0.3);
        "
      >
        <div style="text-align: center; margin-bottom: 30px">
          <h2 style="margin: 0; color: #333; font-size: 24px">
            <i class="fas fa-bolt" style="color: #ff6b6b"></i> Xóa nhanh từ vựng
          </h2>
          <p style="color: #666; margin-top: 10px; font-size: 14px">
            Đang quét:
            <span
              id="quick-delete-progress"
              style="font-weight: bold; color: #e11d48"
              >0/0</span
            >
          </p>
        </div>

        <div
          id="quick-delete-card"
          style="
            background: linear-gradient(135deg, #e11d48 0%, #f97316 100%);
            border-radius: 15px;
            padding: 30px;
            color: white;
            margin-bottom: 25px;
            min-height: 200px;
            display: flex;
            flex-direction: column;
            justify-content: center;
            box-shadow: 0 10px 30px rgba(102, 126, 234, 0.3);
          "
        >
          <div style="text-align: center">
            <i
              class="fas fa-spinner fa-spin"
              style="font-size: 48px; margin-bottom: 20px"
            ></i>
            <p style="font-size: 16px; opacity: 0.9">Đang tải dữ liệu...</p>
          </div>
        </div>

        <div style="display: flex; gap: 15px; justify-content: center">
          <button
            id="btn-quick-delete-keep"
            style="
              flex: 1;
              padding: 15px 30px;
              border: 2px solid #10b981;
              background: white;
              color: #10b981;
              border-radius: 12px;
              font-size: 16px;
              font-weight: bold;
              cursor: pointer;
              transition: all 0.3s;
            "
            onmouseover="
              this.style.background = '#10b981';
              this.style.color = 'white';
            "
            onmouseout="
              this.style.background = 'white';
              this.style.color = '#10b981';
            "
          >
            <i class="fas fa-check"></i> Giữ
          </button>
          <button
            id="btn-quick-delete-remove"
            style="
              flex: 1;
              padding: 15px 30px;
              border: none;
              background: linear-gradient(135deg, #ff6b6b 0%, #ee5a6f 100%);
              color: white;
              border-radius: 12px;
              font-size: 16px;
              font-weight: bold;
              cursor: pointer;
              transition: all 0.3s;
              box-shadow: 0 5px 15px rgba(255, 107, 107, 0.3);
            "
            onmouseover="
              this.style.transform = 'translateY(-2px)';
              this.style.boxShadow = '0 8px 20px rgba(255, 107, 107, 0.4)';
            "
            onmouseout="
              this.style.transform = 'translateY(0)';
              this.style.boxShadow = '0 5px 15px rgba(255, 107, 107, 0.3)';
            "
          >
            <i class="fas fa-trash"></i> Xóa
          </button>
        </div>

        <button
          id="btn-quick-delete-close"
          style="
            margin-top: 20px;
            width: 100%;
            padding: 12px;
            border: 2px solid #ddd;
            background: white;
            color: #666;
            border-radius: 10px;
            font-size: 14px;
            cursor: pointer;
            transition: all 0.3s;
          "
          onmouseover="this.style.background = '#f5f5f5'"
          onmouseout="this.style.background = 'white'"
        >
          <i class="fas fa-times"></i> Đóng
        </button>
      </div>
    </div>
