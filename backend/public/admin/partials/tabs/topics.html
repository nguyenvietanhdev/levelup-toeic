          <!-- ===== TOPICS TAB ===== -->
          <div id="main-tab-topics" class="main-tab-content">
            <div class="card">
              <div class="card-header">
                <h2><i class="fas fa-layer-group"></i> Quản lý Đề luyện tập</h2>
                <div class="card-header-actions">
                  <button class="btn btn-success btn-sm" id="btn-add-topic">
                    <i class="fas fa-plus"></i> Thêm đề
                  </button>
                </div>
              </div>
              <!-- Search + filters row (same layout as Vocabulary tab) -->
              <div style="padding: 0 0 12px; display: flex; gap: 8px; align-items: center">
                <input
                  type="text"
                  id="topics-search"
                  class="card-search"
                  style="flex: 1; margin: 0"
                  placeholder="Tên đề, source key..."
                />
                <select id="topics-filter-words" class="filter-select" style="width: auto; min-width: 130px; flex-shrink: 0">
                  <option value="">Tất cả</option>
                  <option value="0-99">&lt; 100 từ</option>
                  <option value="100-499">100 – 499 từ</option>
                  <option value="500-999">500 – 999 từ</option>
                  <option value="1000-">≥ 1000 từ</option>
                </select>
                <select id="topics-filter-visible" class="filter-select" style="width: auto; min-width: 120px; flex-shrink: 0">
                  <option value="">Tất cả</option>
                  <option value="1">Đang hiện</option>
                  <option value="0">Đang ẩn</option>
                </select>
                <select id="topics-filter-lang" class="filter-select" style="width: auto; min-width: 130px; flex-shrink: 0">
                  <option value="">Tất cả ngôn ngữ</option>
                  <option value="en">🇬🇧 Tiếng Anh</option>
                  <option value="zh">🇨🇳 Tiếng Trung</option>
                </select>
              </div>
              <div class="pagination-row">
                <div id="topics-pagination" class="filter-results-text"></div>
                <div style="display: flex; gap: 8px; align-items: center">
                  <!-- Một nút tự đổi: còn đề ẩn (có từ) → "Xuất bản tất cả"; mọi đề đã hiện → "Ngưng xuất bản tất cả". -->
                  <button class="btn btn-success btn-sm" id="btn-toggle-publish-all-topics">
                    <i class="fas fa-upload"></i> Xuất bản tất cả
                  </button>
                  <button class="btn btn-ghost btn-sm" id="btn-sync-all-topics" title="Cập nhật wordCount từ DB">
                    <i class="fas fa-sync"></i> Sync tất cả
                  </button>
                  <button class="btn btn-ghost btn-sm" id="topics-filter-clear"><i class="fas fa-times"></i> Xóa lọc</button>
                </div>
              </div>
              <div class="table-container">
                <table id="topics-table">
                  <thead>
                    <tr>
                      <th>Tên hiển thị</th>
                      <th>Source Key</th>
                      <th>Số từ</th>
                      <th>Thứ tự</th>
                      <th>Ngôn ngữ</th>
                      <th>Hiện</th>
                      <th>Thao tác</th>
                    </tr>
                  </thead>
                  <tbody id="topics-tbody">
                    <tr>
                      <td colspan="7" class="loading">
                        <i class="fas fa-spinner fa-spin"></i> Đang tải...
                      </td>
                    </tr>
                  </tbody>
                </table>
              </div>
            </div>
          </div>
