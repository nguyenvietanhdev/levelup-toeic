          <!-- ===== QUEST DEFINITIONS TAB ===== -->
          <div id="main-tab-quests" class="main-tab-content">
            <div class="channel-cat-picker" data-channel="quest"></div>
            <div class="card">
              <div class="card-header">
                <h2><i class="fas fa-tasks"></i> Quản lý Nhiệm vụ hàng ngày</h2>
                <div class="card-header-actions">
                  <button class="btn btn-ghost btn-sm" id="btn-copy-quest-json" title="Copy toàn bộ nhiệm vụ hiện có dưới dạng JSON">
                    <i class="fas fa-clipboard"></i> Copy JSON
                  </button>
                  <button class="btn btn-ghost btn-sm" id="btn-ai-gen-quest" title="Sinh nhiệm vụ bằng AI (copy prompt → dán vào ChatGPT/Claude → paste JSON về)">
                    <i class="fas fa-robot"></i> AI Generate
                  </button>
                  <button class="btn btn-success btn-sm" id="btn-add-quest">
                    <i class="fas fa-plus"></i> Thêm nhiệm vụ
                  </button>
                </div>
              </div>
              <div style="padding: 0 0 12px; display: flex; gap: 8px; align-items: center">
                <input type="text" id="quest-search" class="card-search" placeholder="Tên, mã nhiệm vụ..." style="flex: 1; margin: 0" />
                <select id="quest-filter-type" class="filter-select" style="width: auto; min-width: 150px; flex-shrink: 0">
                  <option value="">Tất cả loại</option>
                  <option value="daily">Hàng ngày (daily)</option>
                  <option value="weekly">Hàng tuần (weekly)</option>
                  <option value="monthly">Hàng tháng (monthly)</option>
                  <option value="event">Sự kiện (event)</option>
                </select>
                <select id="quest-filter-mode" class="filter-select" style="width: auto; min-width: 150px; flex-shrink: 0">
                  <option value="">Tất cả chế độ</option>
                  <option value="any">Any</option>
                  <option value="toeic">TOEIC</option>
                  <option value="vocab">Vocab</option>
                  <option value="flashcard">Flashcard</option>
                  <option value="review">Review</option>
                </select>
              </div>
              <div class="table-container">
                <table id="quests-table" class="data-table">
                  <thead><tr>
                    <th>Icon</th><th>Tên</th><th>Loại</th>
                    <th>Chế độ</th><th>Mục tiêu</th>
                    <th>Phần thưởng</th><th>Trạng thái</th><th>Thao tác</th>
                  </tr></thead>
                  <tbody id="quests-tbody">
                    <tr><td colspan="8" class="loading"><i class="fas fa-spinner fa-spin"></i> Đang tải...</td></tr>
                  </tbody>
                </table>
              </div>
            </div>
          </div>
